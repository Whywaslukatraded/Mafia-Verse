name: Free AppSec Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-analysis:
    name: Run Vulnerability Scanners
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to post results to GitHub Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Run Semgrep OSS to find code bugs, XSS, and logic flaws
      - name: Semgrep OSS Code Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=auto --sarif --output=semgrep-results.sarif

      # 2. Run Trivy to check for vulnerable packages/dependencies
      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      # 3. Upload all results back to GitHub so you can review them easily
      - name: Upload Semgrep Results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Trivy Results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
