<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <!-- Magnifying glass handle -->
  <line x1="65" y1="65" x2="80" y2="80" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="45" cy="45" r="20" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <!-- Inner lens -->
  <circle cx="45" cy="45" r="14" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- Glint -->
  <circle cx="38" cy="38" r="3" fill="#93c5fd" opacity="0.8"/>
</svg>