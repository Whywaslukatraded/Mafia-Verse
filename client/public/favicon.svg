<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#9333ea" stroke-width="1" opacity="0.4"/>
  <!-- Hat brim -->
  <ellipse cx="50" cy="42" rx="22" ry="5" fill="#1e1b2e" stroke="#9333ea" stroke-width="1.5"/>
  <!-- Hat body -->
  <rect x="35" y="22" width="30" height="20" rx="4" fill="#1e1b2e" stroke="#9333ea" stroke-width="1.5"/>
  <!-- Hat band -->
  <rect x="35" y="35" width="30" height="5" rx="1" fill="#9333ea" opacity="0.8"/>
  <!-- Face -->
  <ellipse cx="50" cy="58" rx="12" ry="14" fill="#2d2438"/>
  <!-- Eyes (shadowed under hat) -->
  <ellipse cx="44" cy="55" rx="2.5" ry="2" fill="#9333ea" opacity="0.9"/>
  <ellipse cx="56" cy="55" rx="2.5" ry="2" fill="#9333ea" opacity="0.9"/>
  <!-- Mouth - slight smirk -->
  <path d="M 44 65 Q 50 68 56 65" stroke="#9333ea" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Subtle glow dots -->
  <circle cx="22" cy="50" r="1.5" fill="#9333ea" opacity="0.5"/>
  <circle cx="78" cy="50" r="1.5" fill="#9333ea" opacity="0.5"/>
  <circle cx="50" cy="92" r="1.5" fill="#9333ea" opacity="0.5"/>
</svg>
